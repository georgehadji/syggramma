version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: syggramma
      POSTGRES_PASSWORD: syggramma
      POSTGRES_DB: syggramma
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syggramma"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional: Mailpit for development email testing
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    restart: unless-stopped

volumes:
  pgdata:
